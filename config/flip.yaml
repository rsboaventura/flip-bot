# Configuracao do garimpo semanal — flip-bot
# Rota da Luciana: storage em Mississauga, viagem semanal p/ Niagara.

search:
  state: "ON"            # SIGLA (a API nao aceita "Ontario" por extenso)
  country: "Canada"

  # Zonas de retirada = rota semanal da Luciana (QEW: Mississauga -> Niagara).
  # Cada zona e um centro (postal COM espaco) + raio em milhas.
  zones:
    - name: "Mississauga (storage)"
      zip: "L4W 1S9"
      miles: 20
    - name: "Caminho QEW (Burlington/Hamilton)"
      zip: "L8P 1A1"
      miles: 15
    - name: "Niagara (casa)"
      zip: "L2G 3Y4"
      miles: 20

  # ~50 categorias compraveis por <= ~$100 que revendem por MUITO mais no
  # Marketplace. O ranking de lucro cruza cada lote com a mediana do Kijiji
  # da mesma keyword. Ajustar conforme o ledger ensinar o que gira.
  # CUIDADO em devolucao: Apple/AirPods/sneakers tem MUITO falso; conferir foto.
  keywords:
    # ferramentas
    - milwaukee
    - dewalt
    - makita
    - ryobi
    - "tool set"
    # aspiradores (campea do double-check 02/08: +3300%)
    - dyson
    - "robot vacuum"
    - "shark vacuum"
    - "cordless vacuum"
    # beleza (aparelhos, nao cosmetico usado)
    - "dyson airwrap"
    - "hair dryer"
    - "hair straightener"
    - "massage gun"
    - "electric toothbrush"
    - waterpik
    # cozinha
    - kitchenaid
    - "instant pot"
    - "air fryer"
    - "espresso machine"
    - nespresso
    - vitamix
    - "ninja blender"
    - "stand mixer"
    # casa/jardim
    - "pressure washer"
    - generator
    - "shop vac"
    - dehumidifier
    - "air purifier"
    - "patio heater"
    # bebe (NUNCA car seat usado — norma/validade)
    - stroller
    - "baby monitor"
    - "high chair"
    # games/eletronicos
    - nintendo
    - playstation
    - xbox
    - "bluetooth speaker"
    - jbl
    - bose
    - "sony headphones"
    - gopro
    - drone
    - "apple watch"
    - airpods
    - tablet
    # esporte/lazer
    - "exercise bike"
    - "electric scooter"
    - "camping tent"
    - kayak
    # brinquedos/colecionaveis
    - lego
    # tenis de marca
    - "nike shoes"
    - "air jordan"
    - "adidas shoes"
    - "new balance"

# Lista de compras da casa — produtos que voces JA compram na Amazon.
# O scan compara o custo real do leilao com o preco da Amazon e lista os que
# saem por <= max_fraction do preco (default: metade). Editar a vontade:
# keyword = termo de busca no HiBid; amazon_price = preco em CAD na Amazon.
shopping:
  max_fraction: 0.5
  items:
    - keyword: "air fryer"
      amazon_price: 120
    - keyword: "instant pot"
      amazon_price: 130
    - keyword: "coffee maker"
      amazon_price: 100
    - keyword: "robot vacuum"
      amazon_price: 300
    - keyword: "office chair"
      amazon_price: 250

costs:
  buyer_premium_default: 0.16   # usado quando o leiloeiro nao informa (14-17% tipico)
  hst: 0.13                     # Ontario
  # Regra de ouro: so vale se revender por >= resale_multiple x custo total
  resale_multiple: 2.0

report:
  # Lotes com lance atual acima disso nem entram no relatorio (foco em barganha)
  max_current_bid: 100
  # Desconto sobre o preco pedido no Kijiji p/ estimar venda real (choro)
  haircut: 0.15
  # So listar lotes que fecham nos proximos N dias (casar com o dia da viagem)
  closing_within_days: 7
  output_dir: reports

watcher:
  # Cadencia adaptativa de polling por tempo restante (segundos)
  poll_far: 300        # > 1 h para o fim
  poll_near: 60        # < 1 h
  poll_final: 15       # < 10 min — janela do lance
  # Alerta "HORA DO LANCE" quando faltar menos que isso E highBid <= max_bid
  bid_window_seconds: 300
  # Notificacao macOS + som
  notify: true
